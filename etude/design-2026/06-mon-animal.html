<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon animal · Petits Savants 2026</title>
<link rel="stylesheet" href="assets/ds.css">
<style>
  #stage { background: linear-gradient(180deg, #FFE7D6 0%, #FFF1E4 52%, #FFE2CC 100%); }
  .wall-light { position: absolute; left: 0; top: 0; width: 900px; height: 1080px; background: radial-gradient(600px 560px at 50% 46%, rgba(255,255,255,.85), rgba(255,255,255,0) 70%); }
  .window { position: absolute; left: 250px; top: 236px; width: 360px; height: 400px; border-radius: 200px 200px 36px 36px; background: linear-gradient(180deg, #9FD4FF, #DDF0FF 70%, #FFF3DA); box-shadow: 0 0 0 22px #FFF8EF, 0 0 0 26px rgba(160,100,60,.12), 0 30px 40px -10px rgba(160,100,60,.3); overflow: hidden; }
  .window .sun { position: absolute; left: 250px; top: 70px; width: 90px; height: 90px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #FFF6B8, #FFD23F 60%, #FFB21F); }
  .window .hill { position: absolute; border-radius: 50%; }
  .window .bar { position: absolute; background: #FFF8EF; }
  .floor { position: absolute; left: -200px; right: -200px; top: 780px; height: 600px; border-radius: 50% 50% 0 0 / 120px 120px 0 0; background: linear-gradient(180deg, #F2C79C, #E6AF7E); }
  .floor::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 100%; border-radius: inherit; background: repeating-linear-gradient(90deg, rgba(255,255,255,0) 0 158px, rgba(150,90,40,.16) 158px 162px); }
  .rug { position: absolute; left: 140px; top: 830px; width: 580px; height: 150px; border-radius: 50%; background: radial-gradient(ellipse, #FF9DBA 0 30%, #FFF6E8 30% 40%, #FF9DBA 40% 58%, #FFD23F 58% 66%, #FF8FB0 66%); box-shadow: 0 10px 0 #D9708F; }
  .rug-glow { position: absolute; left: 180px; top: 820px; width: 500px; height: 120px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,255,255,.75), rgba(255,255,255,0)); }
  .plant { position: absolute; left: 700px; top: 640px; }

  .pet { position: absolute; left: 196px; top: 368px; width: 470px; height: 611px; }
  .pet .comp { width: 470px; height: 611px; }
  .name { position: absolute; left: 96px; top: 54px; display: flex; align-items: center; gap: 22px; }
  .back { width: 84px; height: 84px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .back .ico { width: 44px; height: 44px; }
  .name .hero { font-size: 88px; }
  .name small { display: block; font-size: 28px; color: var(--mist); margin-top: 2px; }

  .tabs { position: absolute; left: 860px; top: 60px; display: flex; gap: 10px; padding: 8px; border-radius: 999px; background: rgba(30,42,94,.06); }
  .tab { height: 76px; padding: 0 34px; border-radius: 999px; display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 600; font-size: 32px; color: var(--ink-2); }
  .tab.on { background: var(--milk); box-shadow: var(--lift-1); color: var(--ink); font-weight: 700; }
  .tab .ico { width: 38px; height: 38px; }
  .pill { position: absolute; right: 96px; top: 64px; display: flex; align-items: center; gap: 10px; height: 80px; padding: 0 30px 0 16px; border-radius: 999px; background: linear-gradient(180deg, #fff, #FFF6E6); box-shadow: var(--lift-1); font-family: var(--f-display); font-weight: 700; font-size: 38px; }
  .pill .ico { width: 50px; height: 50px; }

  .cats { position: absolute; left: 860px; top: 190px; display: flex; gap: 14px; }
  .cat { height: 64px; padding: 0 26px; border-radius: 999px; display: flex; align-items: center; font-size: 28px; color: var(--ink-2); background: rgba(255,255,255,.55); }
  .cat.on { background: var(--ink); color: var(--lantern); }

  .grid { position: absolute; left: 860px; top: 292px; display: grid; grid-template-columns: repeat(4, 224px); gap: 28px 26px; }
  .tile { height: 214px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 18px; box-sizing: border-box; }
  .tile .art { position: absolute; left: 22px; right: 22px; top: 16px; height: 110px; display: flex; align-items: center; justify-content: center; }
  .tile .art svg { max-width: 100%; max-height: 100%; width: 170px; height: 110px; }
  .tile .nm { font-family: var(--f-display); font-weight: 600; font-size: 28px; }
  .tile .st { margin-top: 6px; height: 40px; display: flex; align-items: center; gap: 6px; padding: 0 14px; border-radius: 999px; font-size: 24px; }
  .tile .st .ico { width: 28px; height: 28px; }
  .st.worn { background: var(--good); color: #fff; }
  .st.mine { background: rgba(30,42,94,.07); color: var(--mist); }
  .st.price { background: #FFF1C2; color: #7A5200; }
  .st.later { background: rgba(30,42,94,.06); color: var(--mist); }
  .tile.later .art { opacity: .5; }
  .tile.worn { background: linear-gradient(180deg, #F2FFF7, #DDF7E8); }

  .say { left: 610px; top: 560px; font-size: 30px; width: 170px; padding: 22px 28px; }
    .note { position: absolute; left: 860px; top: 1000px; font-size: 26px; color: var(--mist); display: flex; gap: 30px; }
  .note b { color: var(--ink); }
  .sparkle { position: absolute; width: 40px; height: 40px; }
</style>
</head>
<body>
<main id="stage">
  <div class="wall-light"></div>
  <div class="window"><div class="sun"></div>
    <div class="hill" style="left:-80px;top:300px;width:360px;height:220px;background:#8FD6A6"></div>
    <div class="hill" style="left:160px;top:320px;width:380px;height:220px;background:#64C189"></div>
    <div class="bar" style="left:174px;top:0;width:12px;height:400px"></div><div class="bar" style="left:0;top:190px;width:360px;height:12px"></div>
  </div>
  <div class="floor"></div>
  <div class="rug"></div><div class="rug-glow"></div>

  <div class="pet in" style="--d:120ms" id="pet"></div>
  <div class="speech tail-left say in" style="--d:900ms">Elle me va bien&#8239;?</div>

  <header class="name in"><span class="back clay f round" id="back"></span><div><h1 class="hero">Praline</h1><small>ta licorne</small></div></header>
  <nav class="tabs in" style="--d:80ms"><span class="tab on f" id="t1">Habiller</span><span class="tab f">Badges</span><span class="tab f">Ma semaine</span></nav>
  <div class="pill in" style="--d:120ms" id="stars">48</div>

  <div class="cats in" style="--d:160ms"><span class="cat on">Tout</span><span class="cat">Tête</span><span class="cat">Visage</span><span class="cat">Cou</span><span class="cat">Haut</span><span class="cat">Pieds</span></div>
  <div class="grid" id="grid"></div>
  <p class="note in" style="--d:900ms"><span><b>OK</b> essayer</span><span><b>Retour</b> c'est fini</span></p>
</main>
<script src="assets/companions.js"></script>
<script src="assets/icons.js"></script>
<script src="assets/stage.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var stars = 48;
  // état de chaque objet : porté, à toi, ou son prix en étoiles (jamais d'argent)
  var items = [
    ["cap", "worn"], ["beanie", "mine"], ["crown", 100], ["party", 30],
    ["flower", "mine"], ["glasses", "mine"], ["scarf", "mine"], ["bow", 40],
    ["tee", "worn"], ["raincoat", 60], ["sneakers", "worn"], ["boots", 50]
  ];
  var worn = { hat: "cap", top: "tee", feet: "sneakers" };
  function render() {
    $("pet").innerHTML = Companion.svg("licorne", { wear: worn, pose: "wave" });
  }
  render();
  $("grid").innerHTML = items.map(function (it, i) {
    var st = it[1], chip;
    if (st === "worn") chip = '<span class="st worn">' + Ico.check() + "Porté</span>";
    else if (st === "mine") chip = '<span class="st mine">À toi</span>';
    else chip = '<span class="st ' + (st <= stars ? "price" : "later") + '">' + Ico.star(st <= stars) + st + "</span>";
    var cls = st === "worn" ? " worn" : (typeof st === "number" && st > stars ? " later" : "");
    return '<div class="tile clay f' + cls + (i === 0 ? " is-focus" : "") + ' in" data-id="' + it[0] + '" style="--d:' + (200 + i * 40) + 'ms"><div class="art">' + Items.icon(it[0]) + '</div><div class="nm">' + Companion.ITEMS[it[0]].name + "</div>" + chip + "</div>";
  }).join("");
  $("stars").insertAdjacentHTML("afterbegin", Ico.star(true));
  $("back").innerHTML = Ico.back();
  $("t1").insertAdjacentHTML("afterbegin", Ico.hanger());
  // essayer : OK met l'objet sur l'animal (aperçu immédiat)
  var SLOT = { cap: "hat", beanie: "hat", crown: "hat", party: "hat", flower: "hat", glasses: "face", scarf: "neck", bow: "neck", tee: "top", raincoat: "top", sneakers: "feet", boots: "feet" };
  $("stage").addEventListener("ok", function (e) {
    var id = e.detail && e.detail.getAttribute("data-id"); if (!id) return;
    worn[SLOT[id]] = worn[SLOT[id]] === id ? null : id; render();
  });
})();
</script>
</body>
</html>
