<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parcours · Petits Savants 2026</title>
<link rel="stylesheet" href="assets/ds.css">
<style>
  #stage { --subj: var(--mots); --subj-glow: var(--mots-glow); --subj-pastel: var(--mots-pastel); }
  .cloud { position: absolute; animation: drift 40s linear infinite alternate; }
  .cloud i { position: absolute; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #fff, #EEF4FF 70%, #DCE6F7); }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(120px); } }
  .land { position: absolute; border-radius: 50%; }

  /* barre du haut */
  .top { position: absolute; left: 96px; right: 96px; top: 46px; height: 96px; display: flex; align-items: center; justify-content: space-between; }
  .who { display: flex; align-items: center; gap: 14px; height: 88px; padding: 0 28px 0 8px; border-radius: 999px; }
  .who .face { width: 76px; height: 76px; border-radius: 50%; overflow: hidden; background: radial-gradient(circle at 40% 30%, #fff, #F1E8FF); box-shadow: 0 0 0 4px #fff; }
  .who .face svg { width: 76px; height: 76px; }
  .who b { font-family: var(--f-display); font-weight: 700; font-size: 40px; color: var(--on-bg); }
  .subjects { display: flex; gap: 14px; align-items: center; }
  .subj { display: flex; align-items: center; justify-content: center; gap: 12px; height: 84px; min-width: 84px; padding: 0 0; border-radius: 999px; box-sizing: border-box; background: linear-gradient(180deg, #fff, #F4F2FA); box-shadow: var(--lift-1); }
  .subj .ico { width: 44px; height: 44px; }
  .subj.active { padding: 0 34px 0 24px; background: linear-gradient(180deg, #CC3562, var(--subj)); color: #FFF6E8; box-shadow: 0 3px 0 rgba(255,255,255,.35) inset, 0 8px 0 #8E1D40, 0 22px 30px -14px rgba(142,29,64,.6); font-family: var(--f-display); font-weight: 700; font-size: 36px; }
  .stats { display: flex; gap: 14px; }
  .pill { display: flex; align-items: center; gap: 10px; height: 76px; padding: 0 26px 0 16px; border-radius: 999px; background: linear-gradient(180deg, #fff, #FFF6E6); box-shadow: var(--lift-1); font-family: var(--f-display); font-weight: 700; font-size: 36px; }
  .pill .ico { width: 46px; height: 46px; }
  .week { display: flex; gap: 6px; align-items: center; }
  .week .ico { width: 40px; height: 46px; }

  .unit { position: absolute; left: 96px; top: 182px; }
  .unit .eyebrow { font-size: 26px; color: var(--on-bg-2); letter-spacing: .5px; display: flex; align-items: center; gap: 10px; }
  .unit .eyebrow i { width: 14px; height: 14px; border-radius: 50%; background: var(--subj); display: inline-block; }
  .unit .row { display: flex; align-items: center; gap: 20px; margin-top: 6px; }
  .unit .h1 { font-size: 76px; color: var(--on-bg); }

  .quest { position: absolute; right: 96px; top: 178px; width: 420px; padding: 22px 26px; box-sizing: border-box; display: flex; align-items: center; gap: 18px; }
  .quest .lans { display: flex; gap: 4px; }
  .quest .lans .ico { width: 46px; height: 52px; }
  .quest b { display: block; font-family: var(--f-display); font-weight: 700; font-size: 32px; }
  .quest span { font-size: 24px; color: var(--mist); }

  .path { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  .node { position: absolute; width: 132px; height: 132px; margin: -66px 0 0 -66px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .node .dome { position: absolute; inset: 0; border-radius: 50%; }
  .node .ico { position: relative; width: 56px; height: 56px; }
  .node.done .dome { background: radial-gradient(circle at 38% 30%, #FFF7C8, #FFD23F 55%, #F0A81A); box-shadow: 0 3px 0 rgba(255,255,255,.7) inset, 0 12px 0 #C98A08, 0 30px 30px -12px rgba(150,90,0,.5); }
  .node.locked .dome { background: radial-gradient(circle at 38% 30%, #FFFFFF, #ECEAF6 60%, #D6D3E8); box-shadow: 0 3px 0 #fff inset, 0 12px 0 #BDB8D6, 0 28px 28px -14px rgba(30,42,94,.35); }
  .node.current { width: 196px; height: 196px; margin: -98px 0 0 -98px; }
  .node.current .dome { background: radial-gradient(circle at 38% 28%, #FF9DBA, var(--subj-glow) 45%, var(--subj) 100%); box-shadow: 0 4px 0 rgba(255,255,255,.45) inset, 0 16px 0 #8E1D40, 0 40px 40px -14px rgba(142,29,64,.55); }
  .node.current .ico { width: 92px; height: 92px; }
  .node .halo { position: absolute; left: -40px; top: -40px; right: -40px; bottom: -40px; border-radius: 50%; border: 6px solid var(--lantern); opacity: 0; animation: ripple 2.4s var(--out) infinite; }
  .node .halo.b { animation-delay: 1.2s; }
  @keyframes ripple { 0% { transform: scale(.7); opacity: .9; } 100% { transform: scale(1.25); opacity: 0; } }
  .node .mstars { position: absolute; top: -34px; display: flex; gap: 0; }
  .node .mstars .ico { width: 40px; height: 40px; }
  .node .mstars .ico:nth-child(2) { margin-top: -12px; }
  .lbl { position: absolute; width: 260px; margin-left: -130px; text-align: center; font-size: 26px; color: var(--on-bg-2); line-height: 1.2; }
  .lbl.muted { color: var(--on-bg-3); }

  .call { position: absolute; left: 640px; top: 420px; width: 580px; padding: 24px 30px 26px; box-sizing: border-box; }
  .call::after { content: ""; position: absolute; left: 50%; bottom: -14px; width: 32px; height: 32px; margin-left: -16px; background: var(--surface-2); transform: rotate(45deg); border-radius: 6px; }
  .call .h3 { font-size: 36px; }
  .call .meta { margin-top: 8px; font-size: 24px; color: var(--mist); display: flex; gap: 16px; align-items: center; }
  .call .go { display: inline-flex; align-items: center; gap: 10px; margin-top: 14px; font-family: var(--f-display); font-weight: 700; font-size: 30px; color: var(--subj); }
  .call .go .k { display: inline-flex; align-items: center; justify-content: center; height: 44px; padding: 0 12px; border-radius: 12px; background: var(--subj); color: #FFF6E8; font-size: 24px; }

  .pet { position: absolute; left: 650px; top: 660px; width: 200px; height: 260px; }
  .pet .comp { width: 200px; height: 260px; }
  .tree { position: absolute; }
  .tree .t { position: absolute; left: 0; top: 0; border-radius: 50%; background: radial-gradient(circle at 38% 30%, #fff, var(--hill-2) 45%, var(--hill-3)); }
  .tree .k { position: absolute; width: 16px; border-radius: 8px; background: linear-gradient(90deg, #B07A4E, #8A5634); }
  .flower { position: absolute; width: 22px; height: 22px; border-radius: 50%; box-shadow: 0 0 0 7px #fff; }
</style>
</head>
<body>
<main id="stage" class="bg-day">
  <div class="cloud" style="left:380px;top:300px"><i style="left:0;top:20px;width:140px;height:70px"></i><i style="left:50px;top:0;width:110px;height:90px"></i><i style="left:110px;top:24px;width:120px;height:66px"></i></div>
  <div class="cloud" style="left:1240px;top:340px;animation-delay:-14s"><i style="left:0;top:16px;width:110px;height:56px"></i><i style="left:36px;top:0;width:90px;height:72px"></i><i style="left:88px;top:18px;width:96px;height:52px"></i></div>

  <!-- le paysage en pâte douce : trois plans -->
  <div class="land" style="left:-300px;top:520px;width:1300px;height:700px;background:radial-gradient(ellipse at 50% 18%, var(--bg-mid), var(--hill-1) 40%, var(--hill-2) 95%)"></div>
  <div class="land" style="left:820px;top:480px;width:1500px;height:760px;background:radial-gradient(ellipse at 45% 16%, var(--bg-mid), var(--hill-1) 40%, var(--hill-2) 95%)"></div>
  <div class="land" style="left:-200px;top:700px;width:2400px;height:900px;background:radial-gradient(ellipse at 50% 10%, var(--hill-1), var(--hill-2) 35%, var(--hill-3) 80%)"></div>

  <svg class="path" viewBox="0 0 1920 1080" aria-hidden="true" id="roads"></svg>

  <div id="deco"></div>
  <div id="nodes"></div>

  <div class="pet in" style="--d:500ms" id="pet"></div>

  <div class="call clay-2 in" style="--d:650ms">
    <div class="h3">Les sons «&#8239;m&#8239;», «&#8239;p&#8239;», «&#8239;b&#8239;»</div>
    <div class="meta"><span>Leçon 3</span><span>·</span><span>5 exercices</span></div>
    <div class="go"><span class="k">OK</span>On y va&#8239;!</div>
  </div>

  <header class="top">
    <div class="who f in" style="--d:40ms"><span class="face" id="face"></span><b>Léa</b></div>
    <nav class="subjects in" style="--d:100ms" id="subjects"></nav>
    <div class="stats in" style="--d:160ms">
      <div class="pill f" id="week"></div>
      <div class="pill f" id="stars">48</div>
    </div>
  </header>

  <section class="unit in" style="--d:220ms">
    <div class="eyebrow"><i></i>Langage · Unité 1 sur 4</div>
    <div class="row"><h1 class="h1">Les sons des mots</h1><span class="speak-btn f round" id="spk"></span></div>
  </section>

  <aside class="quest clay in" style="--d:300ms">
    <div class="lans" id="qlans"></div>
    <div><b>Quête du jour</b><span>2 leçons sur 3</span></div>
  </aside>
</main>
<script src="assets/companions.js"></script>
<script src="assets/icons.js"></script>
<script src="assets/stage.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  $("face").innerHTML = Companion.svg("licorne", { wear: { hat: "flower" } }).replace('viewBox="0 -60 400 520"', 'viewBox="40 0 320 320"');
  var subs = [["mots", "Langage", true], ["nombres"], ["monde"], ["langues"], ["traces"]];
  $("subjects").innerHTML = subs.map(function (s) {
    var col = getComputedStyle(document.documentElement).getPropertyValue("--" + s[0]).trim();
    return '<div class="subj f' + (s[2] ? " active" : "") + '">' + Ico.subject(s[0], s[2] ? "#FFF6E8" : col) + (s[1] || "") + "</div>";
  }).join("");
  var w = '<span class="week">'; for (var i = 0; i < 7; i++) w += Ico.lantern(i < 3); $("week").innerHTML = w + "</span>";
  $("stars").insertAdjacentHTML("afterbegin", Ico.star(true));
  $("spk").innerHTML = Ico.speaker();
  $("qlans").innerHTML = Ico.lantern(true) + Ico.lantern(true) + Ico.lantern(false);
  $("pet").innerHTML = Companion.svg("licorne", { wear: { hat: "flower", neck: "bow" }, pose: "wave" });

  var N = [
    { x: 300, y: 800, k: "done", s: 3, l: "Les voyelles" },
    { x: 520, y: 800, k: "done", s: 2, l: "Les sons « l », « s »" },
    { x: 930, y: 760, k: "current" },
    { x: 1190, y: 650, k: "locked", l: "Les sons « t », « ch »" },
    { x: 1460, y: 790, k: "locked", l: "Les rimes" },
    { x: 1730, y: 620, k: "chest", l: "Le coffre" }
  ];
  // la route passe par les leçons (Catmull-Rom → Bézier)
  function road(pts) {
    var d = "M" + pts[0][0] + " " + pts[0][1];
    for (var i = 0; i < pts.length - 1; i++) {
      var p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
      d += " C" + (p1[0] + (p2[0] - p0[0]) / 6) + " " + (p1[1] + (p2[1] - p0[1]) / 6) + " " + (p2[0] - (p3[0] - p1[0]) / 6) + " " + (p2[1] - (p3[1] - p1[1]) / 6) + " " + p2[0] + " " + p2[1];
    }
    return d;
  }
  var pts = [[120, 980]].concat(N.map(function (n) { return [n.x, n.y]; }));
  var all = road(pts), done = road(pts.slice(0, 4)), todo = road(pts.slice(3));
  $("roads").innerHTML = '<defs><linearGradient id="rd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFDF4"/><stop offset="1" stop-color="#FFF0D2"/></linearGradient></defs>' +
    '<path d="' + all + '" style="stroke:var(--hill-3)" stroke-width="88" fill="none" stroke-linecap="round" transform="translate(0 16)" opacity=".45"/>' +
    '<path d="' + all + '" stroke="url(#rd)" stroke-width="84" fill="none" stroke-linecap="round"/>' +
    '<path d="' + done + '" stroke="#FFC21F" stroke-width="16" fill="none" stroke-linecap="round" stroke-dasharray="2 34"/>' +
    '<path d="' + todo + '" stroke="#D9D3EC" stroke-width="14" fill="none" stroke-linecap="round" stroke-dasharray="2 34"/>';
  $("nodes").innerHTML = N.map(function (n, i) {
    var inner = "", lbl = "";
    if (n.k === "done") { inner = Ico.check("#7A4E00") + '<div class="mstars">' + [0, 1, 2].map(function (j) { return Ico.star(j < n.s); }).join("") + "</div>"; }
    if (n.k === "locked") inner = Ico.lock("#A6A2C4");
    if (n.k === "current") inner = '<div class="halo"></div><div class="halo b"></div>' + Ico.subject("mots", "#FFF6E8");
    if (n.k === "chest") return '<div class="in-pop" style="--d:' + (300 + i * 70) + 'ms;position:absolute;left:' + (n.x - 90) + "px;top:" + (n.y - 110) + 'px;width:180px">' + Ico.obj("chest") + '</div><div class="lbl muted" style="left:' + n.x + "px;top:" + (n.y + 70) + 'px">' + n.l + "</div>";
    if (n.l) lbl = '<div class="lbl' + (n.k === "locked" ? " muted" : "") + '" style="left:' + n.x + "px;top:" + (n.up ? n.y - 140 : n.y + 92) + 'px">' + n.l + "</div>";
    return '<div class="node ' + n.k + (n.k === "current" ? " f round is-focus" : n.k === "done" ? " f round" : "") + ' in-pop" style="left:' + n.x + "px;top:" + n.y + "px;--d:" + (300 + i * 70) + 'ms"><div class="dome"></div>' + inner + "</div>" + lbl;
  }).join("");

  // petits arbres et fleurs en pâte
  var T = [[60, 600, 120], [1600, 470, 96], [1830, 760, 130], [470, 520, 70], [1020, 960, 90], [1300, 930, 70]];
  var deco = T.map(function (t) {
    return '<div class="tree" style="left:' + t[0] + "px;top:" + t[1] + "px;width:" + t[2] + "px;height:" + (t[2] * 1.4) + 'px"><div class="k" style="left:' + (t[2] / 2 - 8) + "px;top:" + (t[2] * .7) + "px;height:" + (t[2] * .62) + 'px"></div><div class="t" style="width:' + t[2] + "px;height:" + t[2] + 'px"></div></div>';
  }).join("");
  [[700, 980, "#FF8FC0"], [760, 1010, "#FFD23F"], [1120, 1000, "#7CC7FF"], [180, 1010, "#FFD23F"], [1690, 960, "#FF8FC0"], [1560, 1010, "#B48CFF"]].forEach(function (f) {
    deco += '<div class="flower" style="left:' + f[0] + "px;top:" + f[1] + "px;background:" + f[2] + '"></div>';
  });
  $("deco").innerHTML = deco;
})();
</script>
</body>
</html>
